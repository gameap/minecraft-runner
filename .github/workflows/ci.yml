name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  build-linux-macos:
    name: Build (Linux/macOS)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: ["linux", "darwin"]
        goarch: ["amd64", "arm64"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.39.0'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build with TinyGo
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} tinygo build -o mcrun-${{ matrix.goos }}-${{ matrix.goarch }}-tinygo .

      - name: Build with Go
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o mcrun-${{ matrix.goos }}-${{ matrix.goarch }} .

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: ["amd64", "arm64"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.39.0'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build with TinyGo
        run: |
          $env:GOARCH="${{ matrix.goarch }}"
          tinygo build -o mcrun-windows-${{ matrix.goarch }}-tinygo.exe .

      - name: Build with Go
        run: |
          $env:CGO_ENABLED="0"
          $env:GOARCH="${{ matrix.goarch }}"
          go build -ldflags="-s -w" -o mcrun-windows-${{ matrix.goarch }}.exe .