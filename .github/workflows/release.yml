name: Release

on:
  release:
    types: [created]

jobs:
  releases-matrix:
    name: Release TinyGo Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: ["linux", "windows", "darwin"]
        goarch: ["amd64", "arm64"]
    steps:
      - uses: actions/checkout@v4

      - name: Set APP_VERSION env
        run: echo APP_VERSION=$(echo ${GITHUB_REF} | rev | cut -d'/' -f 1 | rev ) >> ${GITHUB_ENV}
      - name: Set BUILD_TIME env
        run: echo BUILD_TIME=$(date --iso-8601=seconds) >> ${GITHUB_ENV}
      - name: Set GIT_COMMIT env
        run: echo GIT_COMMIT=$(git rev-parse --short HEAD) >> ${GITHUB_ENV}

      - name: Setup TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.39.0'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set binary extension
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            echo "EXT=.exe" >> ${GITHUB_ENV}
          else
            echo "EXT=" >> ${GITHUB_ENV}
          fi

      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} tinygo build \
            -ldflags="-X 'github.com/gameap/minecraft-runner/cmd/mcrun.Version=${{ env.APP_VERSION }}' -X 'github.com/gameap/minecraft-runner/cmd/mcrun.BuildTime=${{ env.BUILD_TIME }}' -X 'github.com/gameap/minecraft-runner/cmd/mcrun.GitCommit=${{ env.GIT_COMMIT }}'" \
            -o mcrun-${{ matrix.goos }}-${{ matrix.goarch }}${{ env.EXT }} \
            .

      - name: Compress binary (Unix)
        if: matrix.goos != 'windows'
        run: |
          tar -czvf mcrun-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz mcrun-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Compress binary (Windows)
        if: matrix.goos == 'windows'
        run: |
          zip mcrun-${{ matrix.goos }}-${{ matrix.goarch }}.zip mcrun-${{ matrix.goos }}-${{ matrix.goarch }}.exe

      - name: Upload Release Asset (Unix)
        if: matrix.goos != 'windows'
        uses: softprops/action-gh-release@v2
        with:
          files: mcrun-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (Windows)
        if: matrix.goos == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          files: mcrun-${{ matrix.goos }}-${{ matrix.goarch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
